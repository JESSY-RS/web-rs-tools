                            const subItem = getBaseEquipItem(SUB_DB, data.equipments.sub);
                            const decoItem = getBaseEquipItem(DECO_DB, data.equipments.deco);

                            const calculated = recalcResistances(item, mainItem, subItem, decoItem);
                            updateSlot(index, { 
                                ...data, 
                                resistances: calculated.resistances,
                                statusResists: calculated.statusResists
                            });
                        }} 
                    />
                    <div className="grid grid-cols-4 gap-1">
                        {['斬', '打', '突', '熱', '冷', '雷', '陽', '陰'].map((k) => (
                            <div key={k} className="flex items-stretch h-[26px]">
                                <span className={`w-[40%] flex items-center justify-center text-[13px] font-bold ${ATTR_COLORS[k]} bg-black`}>{k}</span>
                                <input type="text" className={`w-[60%] bg-[#333] rounded-sm text-right px-1 text-[12px] font-bold focus:outline-none focus:bg-[#444] ${getValueColor(data.resistances[k])}`} value={data.resistances[k]} onChange={e => handleAttrChange('resistances', k, e.target.value)} onBlur={e => handleResistBlur('resistances', k, e.target.value)} onFocus={e => e.target.select()} />
                            </div>
                        ))}
                    </div>
                </div>
                )}

                {!hiddenSections.statusResist && (
                <div>
                    <div 
                        className="text-[#28BE28] font-bold text-[13px] mb-1 flex items-center cursor-pointer select-none w-fit hover:opacity-80"
                        onDoubleClick={() => onHideSection('statusResist')}
                        title="ダブルクリックで非表示"
                    >
                        <span className="text-[17px] leading-none mr-[1px]">●</span>状態異常耐性
                    </div>
                    <div className="grid grid-cols-4 gap-1">
                        {['毒', '暗', 'ス', 'マ', '眠', '石', '混', '魅', '狂', '気'].map((k) => (
                            <div key={k} className="flex items-stretch h-[26px]">
                                <span className={`w-[40%] flex items-center justify-center text-[13px] font-bold ${STATUS_COLORS[k]} bg-black`}>{k}</span>
                                <input type="text" className={`w-[60%] bg-[#333] rounded-sm text-right px-1 text-[12px] font-bold focus:outline-none focus:bg-[#444] ${getValueColor(data.statusResists[k])}`} value={data.statusResists[k]} onChange={e => handleAttrChange('statusResists', k, e.target.value)} onBlur={e => handleResistBlur('statusResists', k, e.target.value)} onFocus={e => e.target.select()} />
                            </div>
                        ))}
                    </div>
                </div>
                )}

                {!hiddenSections.soulLevel && (
                <div>
                    <div 
                        className="text-fuchsia-500 font-bold text-[13px] mb-1 flex items-center cursor-pointer select-none w-fit hover:opacity-80"
                        onDoubleClick={() => onHideSection('soulLevel')}
                        title="ダブルクリックで非表示"
                    >
                        <span className="text-[17px] leading-none mr-[1px]">●</span>魂Lv
                    </div>
                    <input 
                        type="text"
                        className="w-full h-[28px] bg-[#333] rounded-sm text-gray-200 text-left px-2 text-[13px] font-bold focus:outline-none focus:bg-[#444]" 
                        value={data.soulLevel} 
                        onChange={(e) => {
                            const val = e.target.value;
                            let newAbs = [...data.soulAbilities];
                            if (newAbs.length > getAbilityLimit(val)) newAbs = newAbs.slice(0, getAbilityLimit(val));
                            updateSlot(index, { ...data, soulLevel: val, soulAbilities: newAbs });
                            
                            if (data.name) {
                                const baseName = getDisplayCharName(data.name);
                                setCharLevels(prev => ({ ...prev, [baseName]: val }));
                            }
                        }} 
                        onFocus={e => e.target.select()}
                    />
                </div>
                )}

                {!hiddenSections.skills && (
                <div className="flex flex-col gap-1">
                    <div className="flex justify-between items-center h-[24px]">
                        <div 
                            className="text-yellow-500 font-bold text-[13px] flex items-center cursor-pointer select-none w-fit hover:opacity-80"
                            onClick={onToggleSkillManageMode}
                            onDoubleClick={() => onHideSection('skills')}
                            title="クリックでモード切替 / ダブルクリックで非表示"
                        >
                            <span className="text-[17px] leading-none mr-[1px]">●</span>{globalSkillManageMode ? '技・術管理' : '技・術Rank/継承'}
                        </div>
                        {globalSkillManageMode && (
                            <div className="flex items-center gap-1">
                                <span className="text-[11px] font-bold italic text-yellow-500">OverDrive</span>
                                <input type="checkbox" className="w-[15px] h-[15px] cursor-pointer" checked={data.overDrive || false} onChange={e => updateSlot(index, { ...data, overDrive: e.target.checked })} />
                            </div>
                        )}
                    </div>

                    {!globalSkillManageMode ? (
                        <>
                            <div className="grid grid-cols-4 gap-1">
                                {['s1', 's2', 's3', 'inh'].map((k) => (
                                    <div key={k} className="flex items-stretch h-[26px]">
                                        <span className="w-[45%] flex items-center justify-center text-[13px] font-bold text-gray-400 bg-black whitespace-nowrap">{SKILL_LABELS[k]}</span>
                                        <input type="text" className="w-[55%] bg-[#333] rounded-sm text-right px-1 text-white text-[13px] font-bold focus:outline-none focus:bg-[#444]" value={data.skills[k]} onChange={e=>handleAttrChange('skills',k,e.target.value)} onFocus={e => e.target.select()}/>
                                    </div>
                                ))}
                            </div>
                            <CustomSelect 
                                value={data.inheritedSkill} 
                                options={charAllSkillOptions} 
                                onChange={(v) => {
                                    const isNone = !v || v === "なし";
                                    const newBp = getSkillBP(v);
                                    updateSlot(index, { 
                                        ...data, 
                                        inheritedSkill: v,
                                        skills: { ...data.skills, inh: isNone ? "-" : "99" },
                                        skillNames: { ...data.skillNames, inh: v },
                                        bps: { ...data.bps, inh: newBp },
                                        userDefBps: { ...data.userDefBps, inh: null }
                                    });
                                }} 
                                placeholder="継承技・術 (なし)" 
                            />
                        </>
                    ) : (
                        <div className="flex flex-col gap-1">
                            {['s1', 's2', 's3', 'inh'].map(k => {
                                const defaultBpStr = getSkillBP(data.skillNames[k]);
                                const curBpStr = data.bps[k];
                                let bpColor = 'text-white';

                                const baseBpStr = defaultBpStr !== "-" ? defaultBpStr : (data.userDefBps && data.userDefBps[k]);

                                if (baseBpStr && curBpStr !== "-" && curBpStr !== baseBpStr) {
                                    bpColor = 'text-red-500';
                                }

                                const opts = k === 'inh' ? inhOptionsList : charAllSkillOptions;
                                const pLabel = k === 'inh' ? '継承技・術' : `技・術${k.replace('s','')}`;

                                return (
                                    <div key={k} className="flex items-center gap-1">
                                        <div className="flex-1 min-w-0">
                                            {k !== 'inh' && !!data.name && data.skillNames[k] ? (
                                                (() => {
                                                    const currentSkill = data.skillNames[k];
                                                    let canToggle = false;
                                                    if (currentSkill && currentSkill !== "なし" && currentSkill !== "手動入力") {
                                                        if (currentSkill.endsWith('+') || currentSkill.endsWith('＋')) {
                                                            canToggle = true;
                                                        } else {
                                                            canToggle = SKILL_FULL_DB.some(s => s['名称'] === currentSkill + '＋' || s['スキル名'] === currentSkill + '＋' || s['名称'] === currentSkill + '+' || s['スキル名'] === currentSkill + '+');
                                                        }
                                                    }
                                                    return (
                                                        <div 
                                                            className={`w-full h-[28px] bg-[#333] px-2 flex justify-between items-center rounded-sm ${canToggle ? 'cursor-pointer hover:bg-[#444]' : 'cursor-default'}`}
                                                            onClick={() => {
                                                                if (!canToggle) return;
                                                                
                                                                let newSkill = currentSkill;
                                                                if (currentSkill.endsWith('+') || currentSkill.endsWith('＋')) {
                                                                    newSkill = currentSkill.slice(0, -1);
                                                                } else {
                                                                    const hasFullPlus = SKILL_FULL_DB.some(s => s['名称'] === currentSkill + '＋' || s['スキル名'] === currentSkill + '＋');

### 検索ボックス（×ボタン付き）の全体コード

```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検索ボックスのクリアボタン実装</title>
<style>
  /* 検索ボックスを囲むコンテナ */
  .search-container {
    position: relative;
    width: 300px;
    margin: 20px;
  }

  /* 検索入力フィールド */
  .search-input {
    width: 100%;
    padding: 10px 30px 10px 10px; /* 右側に×ボタン用の余白(30px)を確保 */
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }

  /* ×（クリア）ボタン */
  .clear-button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%); /* 縦方向の中央に配置 */
    cursor: pointer;
    color: #999;
    font-size: 18px;
    font-weight: bold;
    display: none; /* 初期状態では非表示 */
    user-select: none; /* テキスト選択を防ぐ */
  }

  /* ホバー時の色変更 */
  .clear-button:hover {
    color: #333;
  }
</style>
</head>
<body>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="キーワードを入力...">
    <span id="clearButton" class="clear-button">×</span>
  </div>

  <script>
    // 要素の取得
    const searchInput = document.getElementById('searchInput');
    const clearButton = document.getElementById('clearButton');

    // 1. 入力内容に応じて×ボタンの表示/非表示を切り替える
    searchInput.addEventListener('input', function() {
      if (this.value.length > 0) {
        clearButton.style.display = 'block'; // 文字があれば表示
      } else {
        clearButton.style.display = 'none';  // 空なら非表示
      }
    });

    // 2. ×ボタンがクリックされたときの処理
    clearButton.addEventListener('click', function() {
      searchInput.value = '';             // 入力値を空にする
      clearButton.style.display = 'none'; // ボタンを再度非表示にする
      searchInput.focus();                // 続けて入力できるようにフォーカスを戻す
    });
  </script>

</body>
</html>
