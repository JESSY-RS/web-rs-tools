        }

        try {
            var blobUrl = base64ToBlobUrl(VIDEO_BASE64, 'video/mp4');
            video.src = blobUrl;
        } catch (e) {
            console.error("Blob変換で例外発生", e);
        }
        var randomNumberSpan = document.getElementById('random-number');
        var playBtn = document.getElementById('play-video-btn');
        var randomTimes = 0;
        var isPlaying = false;
        // ユーザーがボタンを押して再生を開始したら true にする。
        // primeFirstFrame()がこの後から動いても、ユーザーの再生を
        // 横から止めないようにするためのフラグ。
        var userStarted = false;

        // iOS Safariでは、動画は「再生されるまで」最初のフレーム（静止画）を
        // 描画しないことがあり、ページを開いた直後は真っ黒/空欄に見える。
        // muted動画はユーザー操作なしでも自動再生できる仕様を利用して、
        // 読み込み直後に「一瞬再生してすぐ一時停止」することで
        // 1フレーム目を描画させ、静止画として表示させる。
        function primeFirstFrame() {
            video.play().then(function () {
                // ここに来るまでの間にユーザーがボタンを押して
                // 本番の再生が始まっていたら、それを止めない。
                if (userStarted) {
                    return;
                }
                video.pause();
                video.currentTime = 0;
            }).catch(function (e) {
                console.error("初回play()失敗", e);
            });
        }

        if (video.readyState >= 2) {
            primeFirstFrame();
        } else {
            video.addEventListener('loadeddata', primeFirstFrame, { once: true });
        }

        // 'ended'リスナーはここで一度だけ登録する。
        // (元のコードはボタンを押すたびに追加していたため、2回目以降の
        //  クリックでplayVideo()が二重・三重に呼ばれてしまい、動画が
        //  ガクガクと表示・非表示を繰り返す不具合の主な原因になっていた)
        video.addEventListener('ended', playVideo);

        function playVideo() {
            if (currentPlay < randomTimes) {
                currentPlay++;
                randomNumberSpan.textContent = "　斬った回数: " + currentPlay;

                // 動画データはBase64で埋め込み済み(=ネットワーク待ちなし)なので、
                // currentTimeを0に戻したら間を置かずそのままplay()する。
                // (前回入れた「seekedイベントを待つ」処理は、初回クリック時に
                //  currentTimeがすでに0でseekedが発火せずplay()が一生呼ばれない
                //  という不具合の原因だったため撤去)
                video.currentTime = 0;
                video.play().catch(function (e) {
                    console.error("play()失敗 " + currentPlay + "回目", e);
                    // 万一再生がブロックされた場合も、次のクリックで復帰できるよう
                    // 状態をリセットしておく
                    currentPlay = 0;
                    randomTimes = 0;
                    isPlaying = false;
                });
            } else {
                currentPlay = 0;
                randomTimes = 0;
                isPlaying = false;
                // 動画は最後のフレームで表示されたままにする(pauseしない)
            }
        }

        var currentPlay = 0;

        playBtn.addEventListener('click', function () {
            if (isPlaying) {
                return; // 連打によるカウントの二重発火を防止
            }
            isPlaying = true;
            userStarted = true;

            if (randomTimes === 0) {
                randomTimes = Math.floor(Math.random() * 12) + 1;
                randomNumberSpan.textContent = "　斬った回数: " + randomTimes;
            }

            currentPlay = 0;
            playVideo();
        });

    </script>

</body>
</html>
