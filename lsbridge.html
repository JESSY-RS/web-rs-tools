<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>data bridge</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #2A2A2A;
    color: #ccc;
    font-family: sans-serif;
    text-align: center;
  }
  button {
    margin-top: 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  #btn-hide {
    background: #a83b45;
    color: #fff;
  }
  #btn-close {
    background: #555;
    color: #eee;
  }
</style>
</head>
<body>
<p>データを引き継いでいます…<br>このウィンドウは自動的に閉じます。</p>

<button id="btn-hide">旧サイトの設定を引き継ぐボタンを非表示にする</button>
<button id="btn-close">閉じる</button>

<script>
  // ▼ この橋渡しページを埋め込む／開くことを許可する、新サイト側のオリジンだけを許可する ▼
  const ALLOWED_ORIGINS = [
    'https://web-rs-apps.pages.dev'
  ];
  const NEW_SITE_ORIGIN = ALLOWED_ORIGINS[0];

  window.addEventListener('message', (event) => {
    // 許可していない送信元からの要求は完全に無視する
    if (!ALLOWED_ORIGINS.includes(event.origin)) return;
    if (!event.data || event.data.type !== 'REQUEST_LOCALSTORAGE') return;

    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      data[key] = localStorage.getItem(key);
    }

    // 要求元（event.source）に対してのみ、要求元のオリジン（event.origin）宛に返す
    event.source.postMessage(
      { type: 'LOCALSTORAGE_DATA', data: data, from: location.origin },
      event.origin
    );

    // ポップアップとして開かれている場合は、役目を終えたので自分で閉じる
    // （iframeの場合はwindow.close()は何もしないだけなので無害）
    try {
      window.close();
    } catch (e) {
      // 閉じられない場合は呼び出し元(opener)側がpopup.close()で片付ける
    }
  });

  // ▼ 閉じる（window.close()が効かないアプリ内ブラウザ向けに history.back() を併用） ▼
  document.getElementById('btn-close').addEventListener('click', () => {
    try {
      window.close();
    } catch (e) {
      // 無視
    }
    // window.close()が効かない環境（Xアプリ内ブラウザ等）では、代わりに前の画面へ戻る。
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = NEW_SITE_ORIGIN + '/';
    }
  });

  // ▼ 「旧サイトの設定を引き継ぐ」ボタンを新サイト側で非表示にする ▼
  // postMessageやwindow.opener（ポップアップ連携）に頼らず、ただのページ遷移で伝える。
  // 新サイト側は読み込み時にこのパラメータを見て、恒久的にボタンを消す。
  document.getElementById('btn-hide').addEventListener('click', () => {
    location.href = NEW_SITE_ORIGIN + '/?__lsmigrate_dismiss=1';
  });
</script>
</body>
</html>
